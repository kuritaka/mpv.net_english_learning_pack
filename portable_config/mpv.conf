# mpv.net English Learning configuration
# Place this portable_config directory next to mpvnet.exe.

# Layout: 50% video / 50% subtitle learning panel
video-margin-ratio-right=0.50
video-align-x=-1
keepaspect=yes

# Playback
hwdec=auto-safe
save-position-on-quit=yes
keep-open=yes

# External subtitles
sub-auto=fuzzy
sub-visibility=no

# General
alang=ja,jpn,en,eng
slang=en,eng,ja,jpn
