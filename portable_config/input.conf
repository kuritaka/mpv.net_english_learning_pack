# mpv.net English Learning key / mouse bindings

# Screen click: play / pause
MBTN_LEFT cycle pause

# Escape:
# fullscreen -> windowed
# windowed   -> do nothing
ESC set fullscreen no

# Playback
SPACE cycle pause

# Seek
LEFT seek -5
RIGHT seek 5
UP seek 10
DOWN seek -10

# Fine seek
Shift+LEFT seek -1 exact
Shift+RIGHT seek 1 exact

# English-learning controls
Ctrl+LEFT script-message english-subs-prev
Ctrl+RIGHT script-message english-subs-next

# Replay current subtitle
r script-message english-subs-replay

# Toggle subtitle panel
s script-message english-subs-toggle

# Playback speed
[ add speed -0.1
] add speed 0.1
BS set speed 1.0
